repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^examples/  # generated transcripts are kept verbatim
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: no-api-keys
        name: no API keys in tracked files
        entry: "sk-[A-Za-z0-9_-]{20,}"
        language: pygrep
      - id: no-env-file
        name: .env must not be committed
        entry: .env files must stay local
        language: fail
        files: (^|/)\.env$
